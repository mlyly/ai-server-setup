model_list:
  # GPUs 0 & 1 (64GB VRAM): Architect / Autonomous Planning
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: http://strata:8080/v1
      api_key: os.environ/STRATA_API_KEY
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_tokens: 131072
      supports_function_calling: true

  # GPU 2 (32GB VRAM): Precision Coder & Diffs (Thinking Enabled)
  - model_name: qwen3.8-27b-coder
    litellm_params:
      model: openai/Qwen3.8-27B
      api_base: http://qwen27b:8080/v1
      api_key: "sk-no-key-required"
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_tokens: 131072
      supports_function_calling: true

  # GPU 2 (32GB VRAM): Fast Chat & Sub-Agents (Thinking Disabled per Request)
  - model_name: qwen3.8-27b-fast
    litellm_params:
      model: openai/Qwen3.8-27B
      api_base: http://qwen27b:8080/v1
      api_key: "sk-no-key-required"
      extra_body:
        chat_template_kwargs:
          enable_thinking: false
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      max_tokens: 131072
      supports_function_calling: true

  # CPU (Ollama): Embeddings for Vector Search / RAG
  - model_name: nomic-embed-text
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://embeddings:11434/v1
      api_key: "ollama"
      input_cost_per_token: 0
      output_cost_per_token: 0
    model_info:
      mode: embedding

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  request_timeout: 600
