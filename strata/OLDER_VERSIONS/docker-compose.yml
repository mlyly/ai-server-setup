services:
  strata:
    image: ghcr.io/niko1221/strata:latest-cuda12
    container_name: strata-v100
    restart: unless-stopped

    # Expose API on your LAN (requires API_KEY set below)
    ports:
      - "0.0.0.0:8080:8080"

    # Allocate all 3 V100 GPUs to the container
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    # Increase shared memory for multi-GPU MoE expert arenas
    shm_size: '16gb'

    environment:
      # --- Multi-GPU Configuration (3 x V100) ---
      # - GPU=0,1,2
      # Exactly one card is 'main' (holds output head & draft layer); others are 'helper'
      - GPU_ROLES=0=helper,1=helper,2=main

      # --- Model & Quantization (Sweet spot for 96GB VRAM) ---
      #      - MODEL=Qwen3.8-Flash-Next
      #      - ALLOW_DOWNLOAD=1
      #      # Set context up to 65536 or 131072; int8 uses Volta's fast prompt-attention kernel
      #      - CONTEXT=131072
      #      - KV=int8
      - MODEL=UD-Q4_K_XL
      - ALLOW_DOWNLOAD=1
      - CONTEXT=65536
      - KV=int8

      # --- Volta (sm_70) Performance Tuning ---
      # Enables Volta lookup-table optimization (+10–15% decode speed)
      - STRATA_SM70_TABLE=1
      # Keeps dense weights trimmed per stage so freed VRAM holds more MoE experts
      - STRATA_STAGE_TRIM=1

      # --- Security & Networking ---
      # Required when binding to 0.0.0.0; change this to your own secret key
      - API_KEY=sk-strata-change-me-to-a-strong-key
      - PORT=8080

    volumes:
      # Mount a fast local NVMe/SSD directory on your G431-MM1 for models & caches
      - ./strata-data:/data
