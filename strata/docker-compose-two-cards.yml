services:
  strata:
    image: ghcr.io/niko1221/strata:latest-cuda12
    container_name: strata-v100-dual
    restart: unless-stopped

    # Expose API on your LAN (requires API_KEY set below)
    ports:
      - "0.0.0.0:8080:8080"

    # Allocate ONLY GPUs 0 and 1 (64GB total VRAM), leaving GPU 2 free
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0', '1' ]
              capabilities: [ gpu ]

    # Shared memory for multi-GPU MoE expert arenas
    shm_size: '16gb'

    environment:
      # --- Dual-GPU Configuration (GPUs 0 & 1) ---
      - GPU=0,1
      - GPU_ROLES=0=helper,1=main

      # --- Model & Quantization (Fits nearly 100% inside 64GB VRAM) ---
      - MODEL=IQ3_S
      - ALLOW_DOWNLOAD=1
      - CONTEXT=131072
      - KV=int8

      # --- Volta (sm_70) Performance Tuning ---
      - STRATA_SM70_TABLE=1
      - STRATA_STAGE_TRIM=1

      # --- Security & Networking ---
      - API_KEY=sk-strata-change-me-to-a-strong-key
      - PORT=8080

    volumes:
      - ./strata-data:/data
