services:
  llama-primary:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-v100-primary
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models:ro
      - ./cache:/cache
    environment:
      - LLAMA_ARG_MODEL=/models/Qwen3.6-27B-Q8_0.gguf
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_CTX_SIZE=131072
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_TENSOR_SPLIT=1,1
      - LLAMA_ARG_FLASH_ATTN=on
      - LLAMA_ARG_CACHE_TYPE_K=q8_0
      - LLAMA_ARG_CACHE_TYPE_V=q8_0
      - LLAMA_ARG_SLOT_SAVE_PATH=/cache
      - LLAMA_ARG_JINJA=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '0', '1' ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  llama-fast:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    container_name: llama-v100-fast
    restart: unless-stopped
    ports:
      - "8081:8080"
    volumes:
      - ./models:/models:ro
    environment:
      - LLAMA_ARG_MODEL=/models/Devstral-Small-24B-Q4_K_M.gguf
      - LLAMA_ARG_HOST=0.0.0.0
      - LLAMA_ARG_PORT=8080
      - LLAMA_ARG_CTX_SIZE=65536
      - LLAMA_ARG_N_GPU_LAYERS=99
      - LLAMA_ARG_FLASH_ATTN=on
      - LLAMA_ARG_CACHE_TYPE_K=q8_0
      - LLAMA_ARG_CACHE_TYPE_V=q8_0
      - LLAMA_ARG_JINJA=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: [ '2' ]
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
