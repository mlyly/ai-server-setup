model_list:
  - model_name: qwen-architect
    litellm_params:
      model: openai/qwen-architect
      api_base: http://llama-primary-1:8080/v1
      api_key: os.environ/BACKEND_API_KEY
      timeout: 600

  - model_name: qwen-architect
    litellm_params:
      model: openai/qwen-architect
      api_base: http://llama-primary-2:8080/v1
      api_key: os.environ/BACKEND_API_KEY
      timeout: 600

  - model_name: devstral-worker
    litellm_params:
      model: openai/devstral-worker
      api_base: http://llama-fast:8080/v1
      api_key: os.environ/BACKEND_API_KEY
      timeout: 300

  - model_name: bge-m3
    litellm_params:
      model: openai/bge-m3
      api_base: http://llama-embed:8080/v1
      api_key: os.environ/BACKEND_API_KEY

  - model_name: text-embedding-3-small
    litellm_params:
      model: openai/bge-m3
      api_base: http://llama-embed:8080/v1
      api_key: os.environ/BACKEND_API_KEY

router_settings:
  routing_strategy: least-busy

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true

litellm_settings:
  drop_params: true
  request_timeout: 600
